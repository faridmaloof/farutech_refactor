# Azure DevOps Pipeline for Enterprise Automation Framework
# Full pipeline with build, test, and publish

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    include:
      - src/

pr:
  branches:
    include:
      - main
      - develop
      - feature/*

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'src/Framework.Automation.slnx'
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'

stages:
  - stage: Build
    displayName: 'Build and Package'
    jobs:
      - job: Build
        displayName: 'Build Solution'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: '--no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Create NuGet Packages'
            inputs:
              command: 'pack'
              packagesToPack: '**/*.csproj'
              configuration: '$(buildConfiguration)'
              packDirectory: '$(Build.ArtifactStagingDirectory)/packages'
              nobuild: true

          - publish: '$(Build.ArtifactStagingDirectory)/packages'
            artifact: 'NuGetPackages'
            displayName: 'Publish NuGet Packages'

  - stage: Test
    displayName: 'Test Execution'
    dependsOn: Build
    jobs:
      - job: UI_Tests
        displayName: 'UI Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: '--no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Install Playwright Browsers'
            inputs:
              command: 'custom'
              custom: 'exec'
              arguments: 'playwright.ps1 install --with-deps'
              workingDirectory: 'src/Automation.UI.Tests'

          - task: DotNetCoreCLI@2
            displayName: 'Run UI Tests'
            inputs:
              command: 'test'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: >-
                --no-build
                --filter "FullyQualifiedName~Automation.UI.Tests"
                --logger "trx;LogFileName=$(System.DefaultWorkingDirectory)/TestResults/ui-tests.trx"
                --logger "html;LogFileName=$(System.DefaultWorkingDirectory)/TestResults/ui-tests.html"

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(System.DefaultWorkingDirectory)/TestResults'
              mergeTestResults: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Test Report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/TestResults/ui-tests.html'
              artifact: 'UI-Test-Report'

      - job: API_Tests
        displayName: 'API Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: '--no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run API Tests'
            inputs:
              command: 'test'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: >-
                --no-build
                --filter "FullyQualifiedName~Automation.API.Tests"
                --logger "trx;LogFileName=$(System.DefaultWorkingDirectory)/TestResults/api-tests.trx"

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(System.DefaultWorkingDirectory)/TestResults'
              mergeTestResults: true

  - stage: QualityGates
    displayName: 'Quality Gates'
    dependsOn: [Build, Test]
    condition: succeeded()
    jobs:
      - job: CodeAnalysis
        displayName: 'Code Analysis'
        steps:
          - task: DotNetCoreCLI@2
            displayName: 'Run Code Analysis'
            inputs:
              command: 'build'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: '/p:RunAnalyzers=true /p:EnforceCodeStyleInBuild=true'

          - task: DotNetCoreCLI@2
            displayName: 'Check for Warnings'
            inputs:
              command: 'build'
              projects: '$(solution)'
              configuration: '$(buildConfiguration)'
              arguments: '/warnaserror'
