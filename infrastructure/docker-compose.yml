# =============================================================================
# INFRAESTRUCTURA BASE - FARUTECH ECOSYSTEM
# TASK-017: Infraestructura simplificada - Solo PostgreSQL + Redis (ADR-004)
# =============================================================================
# Este docker-compose levanta TODA la infraestructura base necesaria:
# - Gateway (HAProxy) para routing por dominios y puertos
# - PostgreSQL 17: Única base de datos para todas las aplicaciones
# - Redis 7: Colas, caché y workers
# - Mailhog: Email testing (desarrollo)
# - pgAdmin: Gestión de PostgreSQL
#
# NOTA: MySQL y MongoDB fueron eliminados según ADR-004 (re-alcance)
#
# USO:
#   cp .env.example .env              # Configurar variables
#   docker-compose up -d              # Levantar infraestructura
#   docker-compose down               # Detener infraestructura
#   docker-compose ps                 # Ver estado
#
# DOMINIOS LOCALES (agregar al /etc/hosts):
#   127.0.0.1 admin.farutech.local
#   127.0.0.1 www.farutech.local
#   127.0.0.1 farutech.local
# =============================================================================

services:
  # ===========================================================================
  # GATEWAY - HAProxy
  # ===========================================================================
  # Enruta tráfico HTTP y expone puertos de bases de datos
  gateway:
    image: haproxy:3.2-alpine
    container_name: farutech-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "5432:5432"
      - "6379:6379"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      farutech-proxy-network:
        aliases:
          - gateway.farutech.local
      farutech-data-network:
        aliases:
          - db.farutech.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================================================
  # POSTGRESQL - Única base de datos para todas las aplicaciones
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: farutech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CHANGE_ME_OR_SET_SECRET}
      POSTGRES_USER: ${POSTGRES_USER:-CHANGE_ME_OR_SET_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - farutech-data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # REDIS - Colas, caché y workers
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: farutech-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - farutech-data-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MAILHOG - Email Testing (Desarrollo)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: farutech-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - farutech-data-network
    labels:
      - "com.farutech.service=mailhog"
      - "com.farutech.env=development"

  # ===========================================================================
  # ADMIN - Admin Panel (servido bajo /admin, ver ADR-006)
  # ===========================================================================
  admin:
    build:
      context: ../apps/admin/src/frontend
      dockerfile: Dockerfile
    container_name: farutech-admin
    restart: unless-stopped
    networks:
      - farutech-proxy-network
    depends_on:
      - gateway

  # ===========================================================================
  # FRONTEND - Website público
  # ===========================================================================
  frontend:
    build:
      context: ../apps/website/src/frontend
      dockerfile: Dockerfile
    container_name: farutech-frontend
    restart: unless-stopped
    networks:
      - farutech-proxy-network
    depends_on:
      - gateway

  # ===========================================================================
  # BACKEND - Laravel API (consolidado desde apps/api, ver TASK-014)
  # ===========================================================================
  backend:
    build:
      context: ../apps/website/src/backend
      dockerfile: Dockerfile
    container_name: farutech-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - farutech-data-network
      - farutech-proxy-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # PGADMIN - PostgreSQL Management
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: farutech-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-CHANGE_ME_OR_SET_SECRET}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - farutech-data-network
      - farutech-proxy-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # MONGO EXPRESS - MongoDB Management
  # ===========================================================================
  mongo-express:
    image: mongo-express:1.0.2
    container_name: farutech-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    networks:
      - farutech-data-network
      - farutech-proxy-network
    depends_on:
      mongodb:
        condition: service_healthy

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  farutech-data-network:
    driver: bridge
    name: farutech-data-network
  farutech-proxy-network:
    driver: bridge
    name: farutech-proxy-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  redis_data:
    driver: local
    name: farutech-redis-data
  pgadmin-data:
    driver: local
    name: farutech-pgadmin-data
