# =============================================================================
# INFRAESTRUCTURA BASE - FARUTECH ECOSYSTEM
# TASK-000A: Consolidación completada - 3 motores BD + Redis
# =============================================================================
# Este docker-compose levanta TODA la infraestructura base necesaria:
# - Gateway (HAProxy) para routing por dominios y puertos
# - MySQL 8.4: Website público (lectura principalmente)
# - PostgreSQL 17: Aplicaciones transaccionales (Admin, Intranet, API)
# - MongoDB 8: Logs de auditoría y actividad de Admin
# - Redis 7: Colas, caché y workers
# - Mailhog: Email testing (desarrollo)
# - phpMyAdmin, pgAdmin, Mongo Express: Gestión de BDs
#
# USO:
#   cp .env.example .env              # Configurar variables
#   docker-compose up -d              # Levantar infraestructura
#   docker-compose down               # Detener infraestructura
#   docker-compose ps                 # Ver estado
#
# DOMINIOS LOCALES (agregar al /etc/hosts):
#   127.0.0.1 api.farutech.local
#   127.0.0.1 admin.farutech.local
#   127.0.0.1 www.farutech.local
#   127.0.0.1 farutech.local
# =============================================================================

services:
  # ===========================================================================
  # GATEWAY - HAProxy
  # ===========================================================================
  # Enruta tráfico HTTP y expone puertos de bases de datos
  gateway:
    image: haproxy:3.2-alpine
    container_name: farutech-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "3306:3306"
      - "5432:5432"
      - "27017:27017"
      - "6379:6379"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      farutech-proxy-network:
        aliases:
          - gateway.farutech.local
      farutech-data-network:
        aliases:
          - db.farutech.local
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================================================
  # MYSQL - Website público
  # ===========================================================================
  mysql:
    image: mysql:8.4
    container_name: farutech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-CHANGE_ME_OR_SET_SECRET}
      MYSQL_USER: ${MYSQL_USER:-CHANGE_ME_OR_SET_SECRET}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - farutech-data-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # POSTGRESQL - Aplicaciones transaccionales
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: farutech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CHANGE_ME_OR_SET_SECRET}
      POSTGRES_USER: ${POSTGRES_USER:-CHANGE_ME_OR_SET_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - farutech-data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # MONGODB - Logs de auditoría
  # ===========================================================================
  mongodb:
    image: mongo:8
    container_name: farutech-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-CHANGE_ME_OR_SET_SECRET}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - ./mongodb/data:/data/db
    networks:
      - farutech-data-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===========================================================================
  # REDIS - Colas, caché y workers
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: farutech-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - farutech-data-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MAILHOG - Email Testing (Desarrollo)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: farutech-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - farutech-data-network
    labels:
      - "com.farutech.service=mailhog"
      - "com.farutech.env=development"

  # ===========================================================================
  # PHPMYADMIN - MySQL Management
  # ===========================================================================
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: farutech-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - farutech-data-network
      - farutech-proxy-network
    depends_on:
      mysql:
        condition: service_healthy

  # ===========================================================================
  # PGADMIN - PostgreSQL Management
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: farutech-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-CHANGE_ME_OR_SET_SECRET}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - farutech-data-network
      - farutech-proxy-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # MONGO EXPRESS - MongoDB Management
  # ===========================================================================
  mongo-express:
    image: mongo-express:1.0.2
    container_name: farutech-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    networks:
      - farutech-data-network
      - farutech-proxy-network
    depends_on:
      mongodb:
        condition: service_healthy

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  farutech-data-network:
    driver: bridge
    name: farutech-data-network
  farutech-proxy-network:
    driver: bridge
    name: farutech-proxy-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  redis_data:
    driver: local
    name: farutech-redis-data
  pgadmin-data:
    driver: local
    name: farutech-pgadmin-data
