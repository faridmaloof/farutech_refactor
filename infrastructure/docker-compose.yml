# =============================================================================
# INFRAESTRUCTURA BASE - FARUTECH ECOSYSTEM
# TASK-017: Infraestructura completa con todas las bases de datos opcionales
# =============================================================================
# Este docker-compose levanta TODA la infraestructura base necesaria:
# - Gateway (HAProxy) para routing por dominios y puertos
# - MySQL 8: Base de datos principal para website en Hostinger
# - MongoDB 7: Base de datos para oportunidades y documentos
# - PostgreSQL 17: Base de datos para admin y futuros servicios
# - Redis 7: Colas, caché y workers
# - Mailhog: Email testing (desarrollo)
# - phpMyAdmin: Gestión de MySQL
# - pgAdmin: Gestión de PostgreSQL
# - mongo-express: Gestión de MongoDB
#
# NOTA: Todos estos servicios son OPCIONALES. Cada desarrollador puede:
#   - Levantarlos localmente con este docker-compose
#   - Usar servicios externos (Hostinger, Atlas, etc.)
#   - Las apps se conectan vía variables de entorno (DB_HOST, DB_PORT, etc.)
#
# USO:
#   cp .env.example .env              # Configurar variables
#   docker-compose up -d              # Levantar infraestructura
#   docker-compose down               # Detener infraestructura
#   docker-compose ps                 # Ver estado
#
# DOMINIOS LOCALES (agregar al /etc/hosts):
#   127.0.0.1 admin.farutech.local
#   127.0.0.1 www.farutech.local
#   127.0.0.1 farutech.local
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # GATEWAY - HAProxy
  # ===========================================================================
  gateway:
    image: haproxy:3.2-alpine
    container_name: farutech-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "3306:3306"
      - "5432:5432"
      - "27017:27017"
      - "6379:6379"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - farutech-network
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================================================
  # MYSQL - Base de datos principal para Website (Hostinger compatible)
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: farutech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farutech_website}
      MYSQL_USER: ${MYSQL_USER:-farutech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - farutech-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # MONGODB - Base de datos para oportunidades y documentos
  # ===========================================================================
  mongodb:
    image: mongo:7
    container_name: farutech-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-CHANGE_ME_OR_SET_SECRET}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - mongodb_data:/data/db
    networks:
      - farutech-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # POSTGRESQL - Base de datos para Admin y futuros servicios
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: farutech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farutech_admin}
      POSTGRES_USER: ${POSTGRES_USER:-farutech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - farutech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # REDIS - Colas, caché y workers
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: farutech-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - redis_data:/data
    networks:
      - farutech-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MAILHOG - Email Testing (Desarrollo)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: farutech-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - farutech-network

  # ===========================================================================
  # PHPMYADMIN - MySQL Management
  # ===========================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: farutech-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    networks:
      - farutech-network
    depends_on:
      mysql:
        condition: service_healthy

  # ===========================================================================
  # PGADMIN - PostgreSQL Management
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: farutech-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-CHANGE_ME_OR_SET_SECRET}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - farutech-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # MONGO EXPRESS - MongoDB Management
  # ===========================================================================
  mongo-express:
    image: mongo-express:1.0.2
    container_name: farutech-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-CHANGE_ME_OR_SET_SECRET}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-CHANGE_ME_OR_SET_SECRET}
    networks:
      - farutech-network
    depends_on:
      mongodb:
        condition: service_healthy

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  farutech-network:
    driver: bridge
    name: farutech-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  mysql_data:
    driver: local
    name: farutech-mysql-data
  mongodb_data:
    driver: local
    name: farutech-mongodb-data
  postgres_data:
    driver: local
    name: farutech-postgres-data
  redis_data:
    driver: local
    name: farutech-redis-data
  pgadmin_data:
    driver: local
    name: farutech-pgadmin-data
