global
    log stdout format raw local0
    maxconn 4096
defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# ================================================================
# HTTP
# ================================================================
frontend http_frontend
    bind *:80
    mode http
    acl host_frontend hdr(host) -i farutech.local
    acl host_backend hdr(host) -i api.farutech.local
    acl host_phpmyadmin hdr(host) -i phpmyadmin.db.farutech.local
    acl host_pgadmin hdr(host) -i pgadmin.db.farutech.local
    acl host_mongo_express hdr(host) -i mongo-express.db.farutech.local
    use_backend frontend_backend if host_frontend
    use_backend laravel_backend if host_backend
    use_backend phpmyadmin_backend if host_phpmyadmin
    use_backend pgadmin_backend if host_pgadmin
    use_backend mongo_express_backend if host_mongo_express
    default_backend frontend_backend

# ================================================================
# FRONTEND
# ================================================================
backend frontend_backend
    mode http
    server frontend frontend:80 check

# ================================================================
# LARAVEL
# ================================================================
backend laravel_backend
    mode http
    server backend backend:80 check

# ================================================================
# PHPMYADMIN
# ================================================================
backend phpmyadmin_backend
    mode http
    server phpmyadmin phpmyadmin:80 check

# ================================================================
# PGADMIN
# ================================================================
backend pgadmin_backend
    mode http
    server pgadmin pgadmin:80 check

# ================================================================
# MONGO EXPRESS
# ================================================================
backend mongo_express_backend
    mode http
    server mongo_express mongo-express:8081 check

# ================================================================
# MYSQL
# db.farutech.local:3306
# ================================================================
frontend mysql_frontend
    bind *:3306
    mode tcp
    default_backend mysql_backend
backend mysql_backend
    mode tcp
    server mysql mysql:3306 check

# ================================================================
# POSTGRESQL
# db.farutech.local:5432
# ================================================================
frontend postgres_frontend
    bind *:5432
    mode tcp
    default_backend postgres_backend
backend postgres_backend
    mode tcp
    server postgres postgres:5432 check

# ================================================================
# MONGODB
# db.farutech.local:27017
# ================================================================
frontend mongodb_frontend
    bind *:27017
    mode tcp
    default_backend mongodb_backend
backend mongodb_backend
    mode tcp
    server mongodb mongodb:27017 check
