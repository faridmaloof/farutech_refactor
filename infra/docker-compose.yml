version: '3.8'

# =============================================================================
# INFRAESTRUCTURA BASE - FARUTECH ECOSYSTEM
# =============================================================================
# Este docker-compose levanta TODA la infraestructura base necesaria:
# - Gateway (Traefik/Nginx) para routing por dominios
# - Base de datos PostgreSQL
# - Redis para colas y cache
# - Mailhog para desarrollo de emails
# 
# USO:
#   docker-compose up -d                    # Levantar infraestructura
#   docker-compose down                     # Detener infraestructura
#   docker-compose ps                       # Ver estado
#   
# DOMINIOS LOCALES (agregar al /etc/hosts):
#   127.0.0.1 api.farutech.local
#   127.0.0.1 admin.farutech.local
#   127.0.0.1 www.farutech.local
#   127.0.0.1 farutech.local
# =============================================================================

services:
  # ===========================================================================
  # GATEWAY / REVERSE PROXY
  # ===========================================================================
  # Enruta tráfico a cada aplicación según el dominio
  gateway:
    image: nginx:alpine
    container_name: farutech_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - farutech_network
    depends_on:
      - postgres
      - redis
    labels:
      - "com.farutech.service=gateway"

  # ===========================================================================
  # BASE DE DATOS - PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: farutech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-farutech}
      POSTGRES_USER: ${DB_USERNAME:-farutech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Farutech2024!Secure}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/backups:/backups
    ports:
      - "5432:5432"
    networks:
      - farutech_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-farutech} -d ${DB_DATABASE:-farutech}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.farutech.service=database"

  # ===========================================================================
  # REDIS - Colas y Caché
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: farutech_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-FarutechRedis2024!}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - farutech_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.farutech.service=redis"

  # ===========================================================================
  # MAILHOG - Email Testing (Solo Desarrollo)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: farutech_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - farutech_network
    labels:
      - "com.farutech.service=mailhog"
      - "com.farutech.env=development"

  # ===========================================================================
  # PGADMIN - Database Management (Opcional)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: farutech_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@farutech.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-FarutechAdmin2024!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - farutech_network
    depends_on:
      - postgres
    labels:
      - "com.farutech.service=pgadmin"
      - "com.farutech.env=development"

networks:
  farutech_network:
    driver: bridge
    name: farutech_network

volumes:
  postgres_data:
    driver: local
    name: farutech_postgres_data
  redis_data:
    driver: local
    name: farutech_redis_data
  pgadmin_data:
    driver: local
    name: farutech_pgadmin_data
