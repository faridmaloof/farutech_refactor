# Redis configuration for Farutech Ecosystem
# Optimizado para colas y caché

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Security (password se pasa por variable de entorno en docker-compose)
# requirepass FarutechRedis2024!

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Cluster disabled (single node for now)
# cluster-enabled no
